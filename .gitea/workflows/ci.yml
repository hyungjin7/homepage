name: Homepage configuration validation

# GitHub dev is the deployment source. Argo CD applies deploy/k3s.
# Gitea mirrors the source and validates it without cluster credentials.
on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: homepage-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Render manifests offline
        run: |
          set -euo pipefail
          mkdir -p /tmp/homepage-tools
          cd /tmp/homepage-tools
          BASE=https://dl.k8s.io/release/v1.36.3/bin/linux/amd64
          curl -fsSLO "$BASE/kubectl"
          curl -fsSLO "$BASE/kubectl.sha256"
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum --check
          chmod +x kubectl
          cd "$GITHUB_WORKSPACE"
          /tmp/homepage-tools/kubectl kustomize deploy/k3s > .homepage-rendered.yaml
          bash -n deploy/k3s/ingress-cards.sh
      - name: Validate Homepage scope and settings
        run: |
          set -euo pipefail
          tar -cf - deploy/k3s .homepage-rendered.yaml | docker run --rm -i python:3.12-slim sh -ec '
            mkdir -p /workspace
            tar -xf - -C /workspace
            cd /workspace
            pip install --disable-pip-version-check -q PyYAML==6.0.3
            python deploy/k3s/validate_gitops.py .homepage-rendered.yaml
            python -m unittest discover -s deploy/k3s/tests -v
          '
