# homepage.delvrio.com 설치 묶음. 적용: kubectl apply -k deploy/k3s
# 설정 파일(config/*.yaml)을 고치고 다시 apply 하면 ConfigMap 이름이 바뀌어 Pod 가 저절로 새로 뜬다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
- 00-namespace.yaml
- 01-rbac.yaml
- 02-app.yaml
- 03-sso-ingress.yaml
configMapGenerator:
- name: homepage-config
  files:
  - config/settings.yaml
  - config/services.yaml
  - config/bookmarks.yaml
  - config/widgets.yaml
  - config/kubernetes.yaml
  - config/docker.yaml
  - config/custom.css
  - config/custom.js
