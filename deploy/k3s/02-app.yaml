# Homepage 본체. 원본 공식 이미지를 고정 태그로 쓴다(포크는 설정만 담는다).
# 저장할 자료가 없어 DB·PVC 가 없다. 설정 폴더·로그는 emptyDir(Pod 가 다시 뜨면 ConfigMap 에서 다시 복사).
# 버전 올리기: image 태그만 바꿔 다시 apply.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: homepage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homepage
    spec:
      serviceAccountName: homepage
      automountServiceAccountToken: true
      enableServiceLinks: false
      initContainers:
      - name: copy-config
        image: ghcr.io/gethomepage/homepage:v2.8.0
        imagePullPolicy: IfNotPresent
        command: ["sh", "-c", "cp /config-src/* /app/config/"]
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - {name: config, mountPath: /config-src, readOnly: true}
        - {name: config-dir, mountPath: /app/config}
      containers:
      - name: homepage
        image: ghcr.io/gethomepage/homepage:v2.8.0
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: [ALL]
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
        env:
        - name: MY_POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        # 접속을 허락할 주소. 앞의 Pod IP 는 쿠버네티스 상태 점검(probe)용으로 꼭 필요하다.
        - name: HOMEPAGE_ALLOWED_HOSTS
          value: "$(MY_POD_IP):3000,homepage.delvrio.com"
        # 로그인은 Traefik 문지기(델브 로그인, 03-sso-ingress.yaml)가 맡으므로 자체 로그인은 끈다.
        - name: HOMEPAGE_AUTH_ENABLED
          value: "false"
        # 위젯 API 키 등 비밀 값: Secret homepage-secrets 의 HOMEPAGE_VAR_xxx 를 설정에서 {{HOMEPAGE_VAR_xxx}} 로 쓴다.
        # Secret 이 없어도 뜬다(optional).
        envFrom:
        - secretRef:
            name: homepage-secrets
            optional: true
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /api/healthcheck
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /api/healthcheck
            port: http
          initialDelaySeconds: 15
          periodSeconds: 20
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: "1"
            memory: 512Mi
        volumeMounts:
        - {name: config-dir, mountPath: /app/config}
      volumes:
      - name: config
        configMap:
          name: homepage-config
      # /app/config 는 쓰기 가능한 빈 폴더(emptyDir). 시작할 때 ConfigMap 파일을 복사해 넣는다.
      # 새 버전이 설정 파일을 더 요구해도(예: proxmox.yaml) 앱이 기본 파일을 스스로 만들 수 있다. 로그도 여기 쌓인다.
      - name: config-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: homepage
  ports:
  - name: http
    port: 3000
    targetPort: http
    protocol: TCP
