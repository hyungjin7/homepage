# 예시만 커밋한다. 실제 값은 kubectl 로 만들고 이 파일은 적용하지 않는다(kustomization 에 없음).
#   kubectl -n homepage create secret generic homepage-secrets \
#     --from-literal=HOMEPAGE_VAR_GRAFANA_PASSWORD='...'
# 설정 파일에서 {{HOMEPAGE_VAR_GRAFANA_PASSWORD}} 로 쓴다.
apiVersion: v1
kind: Secret
metadata:
  name: homepage-secrets
  namespace: homepage
type: Opaque
stringData:
  HOMEPAGE_VAR_EXAMPLE: "change-me"
