# homepage.delvrio.com 에 delvrio 공통 로그인(SSO)을 건다 — Headlamp(k8s.delvrio.com)·Flower 와 같은 방식.
# - Traefik 이 모든 요청마다 bbb dcore 에 "이 쿠키(dlv_sso) 주인 들어와도 돼?"를 묻는다(bbb apps/accounts/sso.py forward_auth).
# - 로그인 안 됨: 로그인 창구 login.delvrio.com 으로 보냈다가 다시 돌아온다.
# - 권한 없음: 403 — 사용 권한 = bbb navigation_apps 의 homepage 행(required_group homepage, superuser 는 항상).
# - 회사에서만 열고 싶으면 아래 homepage-lan 을 router.middlewares 앞에 더한다(지금은 꺼 둠).
# Traefik 진입 설정(HelmChartConfig 등)은 건드리지 않는다. Middleware·Ingress 만 더한다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homepage-sso
  namespace: homepage
spec:
  forwardAuth:
    address: http://core-service.bbb-namespace.svc.cluster.local:8000/api/core/auth/forward/
    authResponseHeaders:
    - X-Auth-User
    - X-Auth-Username
    - X-Auth-Email
---
# 회사 전용 문(선택). 켜려면 Ingress annotation 을
#   homepage-homepage-lan@kubernetescrd,homepage-homepage-sso@kubernetescrd 로 바꾼다.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homepage-lan
  namespace: homepage
spec:
  ipAllowList:
    sourceRange:
    - 192.168.219.0/24     # 사내 LAN
    - 124.60.216.214/32    # 회사 공인 IP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: homepage-ingress
  namespace: homepage
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.middlewares: homepage-homepage-sso@kubernetescrd
    # Homepage 카드 이름표(README "카드 자동 등록")
    gethomepage.dev/enabled: "true"
    gethomepage.dev/external: "true"
    gethomepage.dev/name: Homepage
    gethomepage.dev/group: Cloud
    gethomepage.dev/icon: homepage.png
    gethomepage.dev/description: 이 화면
    gethomepage.dev/weight: "99"
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - homepage.delvrio.com
    secretName: homepage-tls
  rules:
  - host: homepage.delvrio.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: homepage
            port:
              number: 3000
